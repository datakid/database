<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#eff1e9">
<title>LX Database</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cg transform='rotate(-40 22 22)'%3E%3Cpath d='M20.5 9a13 13 0 0 0 0 26z' fill='%23496f45'/%3E%3Cpath d='M23.5 9a13 13 0 0 1 0 26z' fill='%23a59e56'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<script>
try {
  var t = localStorage.getItem('lx-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.getElementById('tc').content = t === 'dark' ? '#151813' : '#eff1e9';
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{--bg:#eff1e9;--surf:#f7f9f3;--ink:#202518;--mute:#5d6353;--faint:#84887a;--line:#dbded4;--line2:#c7cbbf;--hover:#e8ebe1;--wf:#496f45;--st:#a59e56;--err:#9a5146;--r:5px;--rl:10px;--ui:'Hanken Grotesk',system-ui,sans-serif;--serif:'Newsreader',Georgia,'Times New Roman',serif;--pop:0 16px 40px -22px rgba(32,37,24,.4);color-scheme:light}
[data-theme=dark]{--bg:#151813;--surf:#1e221b;--ink:#e8ebe1;--mute:#a2a798;--faint:#6f7467;--line:#292d26;--line2:#3a3f36;--hover:#1c1f19;--wf:#88ba89;--st:#d6d692;--err:#da8e81;--pop:0 16px 40px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}
.page{--pad:clamp(1.25rem,4vw,3.25rem);max-width:1240px;margin:0 auto;padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr);gap:2rem}
.top{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.7rem}
.mark{width:30px;height:30px;flex:none}
.mark.busy{animation:spin 1.4s linear infinite}
h1{font:italic 400 1.35rem/1 var(--serif);letter-spacing:-.01em}
.stat{display:flex;align-items:center;gap:.45rem;color:var(--mute);font-size:.82rem;margin-left:.5rem;padding-left:1rem;border-left:1px solid var(--line2);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--wf)}
.dot.err{background:var(--err)}
.dot.busy{animation:blink .8s ease-in-out infinite}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1.5rem}
.seg{position:relative;display:flex;gap:1.4rem;height:36px}
.seg::after{content:"";position:absolute;left:var(--x,0);width:var(--w,0);bottom:0;height:2px;border-radius:2px;background:var(--ink);transition:left .3s cubic-bezier(.3,.8,.2,1),width .3s cubic-bezier(.3,.8,.2,1)}
.seg button{color:var(--mute);font:500 .9rem/1 var(--ui);transition:color .15s}
.seg button:hover,.seg button[aria-pressed=true]{color:var(--ink)}
.acts{display:flex;align-items:center;gap:.25rem;margin-left:.75rem}
.btn{height:36px;padding:0 .8rem;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;color:var(--mute);font:500 .875rem/1 var(--ui);white-space:nowrap;transition:color .15s,background-color .15s,border-color .15s}
.btn:hover{color:var(--ink);background:var(--hover)}
.btn.icon{width:36px;padding:0}
.btn.primary{border:1px solid var(--ink);color:var(--ink);margin-left:.5rem}
.btn.primary:hover{background:var(--ink);color:var(--bg)}
.btn.spin svg{animation:spin .8s linear infinite}
.tog{height:36px;padding:0;color:var(--mute);font:500 .9rem/1 var(--ui);box-shadow:inset 0 -2px 0 transparent;transition:color .15s,box-shadow .2s}
.tog:hover{color:var(--ink)}
.tog[aria-pressed=true],.tog[aria-checked=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}
.lede{font:300 clamp(1.85rem,4vw,3.4rem)/1.18 var(--serif);letter-spacing:-.022em;color:var(--mute);max-width:21em;text-wrap:balance;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.lede b{font-weight:400;font-style:italic;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.mix{display:grid;gap:.7rem;margin-top:-.75rem}
.bar{display:flex;gap:3px;height:4px}
.bar i{display:block;flex:var(--g,0) 1 0%;min-width:0;border-radius:2px;background:var(--faint);transition:flex-grow .6s cubic-bezier(.3,.8,.2,1)}
.bar i[data-s=Workforce],.mixt span[data-s=Workforce]::before{background:var(--wf)}
.bar i[data-s=Student],.mixt span[data-s=Student]::before{background:var(--st)}
.mixt{display:flex;flex-wrap:wrap;gap:.2rem 1.5rem;color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums}
.mixt span::before{content:"";display:inline-block;vertical-align:middle;width:12px;height:6px;border-radius:6px;margin-right:.5rem;background:var(--faint)}
.fields{display:grid;gap:1.1rem}
.field{position:relative}
.field>svg{position:absolute;left:0;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none;transition:color .15s}
.field:focus-within>svg{color:var(--ink)}
.in,.dd-btn{width:100%;height:46px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;color:var(--ink);font:400 1rem/1 var(--ui);transition:border-color .15s}
.in{padding:0 4.4rem 0 1.9rem;font-size:1.1rem}
.in::placeholder{color:var(--mute);opacity:.8}
.in::-webkit-search-cancel-button{display:none}
.in:hover,.dd-btn:hover{border-bottom-color:var(--faint)}
.in:focus{outline:none;border-bottom-color:var(--ink)}
.exact{position:absolute;right:0;top:50%;translate:0 -50%;height:28px;padding:0 .65rem;border-radius:var(--r);font:500 .8rem/1 var(--ui);color:var(--mute);transition:color .15s,background-color .15s}
.exact:hover{color:var(--ink)}
.exact[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#ddHost{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 1.75rem}
.dd{position:relative}
.dd-box{position:relative}
.dd-btn{display:flex;align-items:center;padding:0 1.7rem 0 0;text-align:left;color:var(--mute);font-size:.95rem}
.dd-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd.set .dd-btn{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.dd-c{position:absolute;right:.1rem;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none;transition:rotate .2s}
.dd-btn[aria-expanded=true]~.dd-c{rotate:180deg}
.dd.set .dd-c{display:none}
.dd-x{position:absolute;right:0;top:50%;translate:0 -50%;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.dd-x:hover{background:var(--hover)}
.dd-panel{position:absolute;z-index:30;left:0;min-width:max(100%,240px);max-width:340px;top:calc(100% + 6px);background:var(--surf);border:1px solid var(--line2);border-radius:var(--rl);box-shadow:var(--pop);padding:.4rem;animation:pop .14s ease}
.dd.up .dd-panel{top:auto;bottom:calc(100% + 6px)}
.dd.end .dd-panel{left:auto;right:0}
.dd-q{width:100%;height:36px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:0 .65rem;margin-bottom:.3rem;font-size:.9rem}
.dd-q:focus{outline:none;border-bottom-color:var(--ink)}
.dd-t{display:none}
.dd-list{list-style:none;max-height:264px;overflow:auto;padding:0;outline:none}
.dd-o{display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border-radius:var(--r);cursor:pointer;font-size:.9rem;color:var(--mute)}
.dd-o.act{background:var(--hover);color:var(--ink)}
.dd-o.sel{color:var(--ink);font-weight:600}
.dd-o.sel::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.dd-more{padding:.55rem .65rem;color:var(--mute);font-size:.8rem;pointer-events:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1.4rem}
.lbl{color:var(--mute);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;min-height:24px;color:var(--mute);font-size:.85rem;font-variant-numeric:tabular-nums;margin-bottom:.35rem}
.link{color:var(--mute);font-size:.85rem;text-decoration:underline;text-underline-offset:4px;transition:color .15s}
.link:hover{color:var(--ink)}
.link.end{margin-left:auto}
.banner{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border:1px solid var(--line);border-left:2px solid var(--st);border-radius:var(--r);background:var(--surf);font-size:.9rem}
.banner .btn{margin-left:auto}
.boxw{position:relative}
.box{position:relative;overflow:auto;height:min(72vh,800px);height:min(72dvh,800px);min-height:340px;border-top:1px solid var(--line2);overscroll-behavior:contain}
.box:focus-visible{outline-offset:-2px}
.tin{position:relative}
.head,.r{display:grid;gap:1rem;padding:0 .5rem;align-items:center}
.head{position:sticky;top:0;z-index:2;height:46px;background:var(--bg);border-bottom:1px solid var(--line)}
.head button{display:flex;align-items:center;gap:.3rem;height:100%;white-space:nowrap;color:var(--mute);font:500 .7rem/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;transition:color .15s}
.head button:hover,.head button[aria-sort]{color:var(--ink)}
.head svg{opacity:0;transition:opacity .15s,rotate .2s}
.head button[aria-sort] svg{opacity:1}
.head button[aria-sort=descending] svg{rotate:180deg}
#body{position:relative}
#body.v{position:sticky;top:46px;overflow:hidden}
#pad{pointer-events:none}
.r{position:absolute;left:0;right:0;height:var(--row,52px);border-bottom:1px solid var(--line);font-size:.92rem;transition:background .12s;will-change:transform}
@media(hover:hover){.r:hover{background:var(--hover)}}
.r.w>div{visibility:hidden}
.r>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.r>.t{color:var(--ink)}
.c-name{font-weight:500}
.src::before{content:"";display:inline-block;vertical-align:middle;width:12px;height:6px;border-radius:6px;margin-right:.55rem;background:var(--faint)}
.src[data-s=Workforce]::before{background:var(--wf)}
.src[data-s=Student]::before{background:var(--st)}
.u{display:flex;align-items:center;gap:.9rem}
.r>.u{color:var(--ink)}
.u span{min-width:5ch;font-weight:500;font-variant-numeric:tabular-nums}
.u i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.u b{display:block;height:100%;border-radius:3px;background:var(--mute);opacity:.55;min-width:3px;transition:width .3s}
.u b[data-s=Workforce]{background:var(--wf);opacity:1}
.u b[data-s=Student]{background:var(--st);opacity:1}
.pos{position:absolute;right:1rem;bottom:1rem;padding:.45rem .8rem;border-radius:999px;background:var(--ink);color:var(--bg);font:500 .75rem/1 var(--ui);font-variant-numeric:tabular-nums;opacity:0;translate:0 6px;transition:opacity .2s,translate .2s;pointer-events:none}
.pos.on{opacity:1;translate:0 0}
.empty{position:absolute;inset:46px 0 0;display:grid;place-content:center;justify-items:center;gap:.8rem;color:var(--mute);text-align:center;pointer-events:none;font:italic 400 1.25rem/1.3 var(--serif)}
.empty button{pointer-events:auto;font:500 .875rem/1 var(--ui)}
dialog{margin:auto;border:1px solid var(--line2);border-radius:var(--rl);background:var(--surf);color:var(--ink);padding:0;width:min(720px,92vw);box-shadow:var(--pop)}
dialog::backdrop{background:rgba(21,24,19,.5);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line)}
.dh h2{font:italic 400 1.3rem/1 var(--serif);margin-right:auto}
.db{max-height:60vh;overflow:auto;padding:.2rem 1.4rem 1.1rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--mute);font:500 .7rem/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;padding:.9rem .5rem}
td{padding:.6rem .5rem;border-top:1px solid var(--line)}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
#dupSent{height:1px}
@keyframes spin{to{rotate:360deg}}
@keyframes blink{50%{opacity:.3}}
@keyframes pop{from{opacity:0;translate:0 -4px}}
@keyframes rise{from{opacity:0;translate:0 10px}}
@media(max-width:900px){#ddHost{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(pointer:coarse){.btn,.tog,.seg{height:40px}.btn.icon{width:40px}.dd-x{width:32px;height:32px}}
@media(max-width:960px){
.tin{min-width:0!important}
.head{display:flex;gap:1.2rem;overflow-x:auto;scrollbar-width:none;padding:0 .25rem}
.head::before{content:"Sort";color:var(--mute);font:500 .7rem/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;align-self:center;flex:none}
.head button{flex:none;white-space:nowrap}
.r{display:flex;flex-wrap:wrap;align-content:center;align-items:baseline;gap:0;padding:.3rem .25rem;overflow:hidden}
.r>div{order:3;flex:none;max-width:100%;padding-right:.9rem;font-size:.82rem;line-height:1.4;color:var(--mute)}
.r>.t{order:1;flex:1 1 calc(100% - 7rem);min-width:0;padding-right:.75rem;font-size:1rem;line-height:1.35;font-weight:600;color:var(--ink)}
.r>.u{order:2;flex:0 0 6.5rem;justify-content:flex-end;padding:0;font-size:.95rem;color:var(--ink)}
.u i{display:none}
.u span{min-width:0;text-align:right}
}
@media(max-width:640px){
.top{gap:.9rem}
.brand{width:100%}
.stat{margin-left:auto;padding:0;border:0}
.tools{width:100%;gap:.4rem}
.seg{width:100%;gap:0}
.seg button{flex:1;text-align:center}
.acts{width:100%;margin-left:0}
.btn.primary{margin-left:auto}
.lede{font-size:1.75rem}
#ddHost{grid-template-columns:repeat(2,minmax(0,1fr));gap:.25rem 1.25rem}
.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad)*-1);padding-inline:var(--pad)}
.row::-webkit-scrollbar,.head::-webkit-scrollbar{display:none}
.row>*{flex:none}
.box{height:min(78vh,820px);height:min(78dvh,820px)}
.dd .dd-panel{position:fixed;left:0!important;right:0!important;top:auto!important;bottom:0!important;min-width:0;max-width:none;border-radius:20px 20px 0 0;border-bottom:0;padding:.4rem .9rem calc(.9rem + env(safe-area-inset-bottom));box-shadow:0 0 0 100vmax rgba(21,24,19,.48);animation:sheet .22s ease}
.dd-t{display:block;padding:.9rem .35rem .6rem;font:italic 400 1.2rem/1 var(--serif)}
.dd-list{max-height:min(50vh,420px);max-height:min(50dvh,420px)}
.dd-o{padding:.8rem .75rem;font-size:1rem}
.dd-q{height:44px;font-size:1rem}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0;max-height:88vh;max-height:88dvh}
table{min-width:560px}
.db{padding-bottom:calc(1.1rem + env(safe-area-inset-bottom))}
}
@keyframes sheet{from{translate:0 28px;opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <svg class="mark" id="mark" viewBox="0 0 44 44" aria-hidden="true">
        <g transform="rotate(-40 22 22)">
          <path d="M20.5 9a13 13 0 0 0 0 26z" fill="var(--wf)"/>
          <path d="M23.5 9a13 13 0 0 1 0 26z" fill="var(--st)"/>
        </g>
      </svg>
      <h1>LX Database</h1>
      <p class="stat"><span class="dot" id="dot"></span><span id="stat">Connecting</span></p>
    </div>
    <div class="tools">
      <div class="seg" id="seg" role="group" aria-label="Source">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="Workforce" aria-pressed="false">Workforce</button>
        <button data-v="Student" aria-pressed="false">Student</button>
      </div>
      <div class="acts">
        <button class="tog" id="autoBtn" role="switch" aria-checked="false" title="Sync every 45 seconds">Auto-sync</button>
        <button class="btn icon" id="syncBtn" title="Sync now" aria-label="Sync now"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></button>
        <button class="btn icon" id="themeBtn" title="Switch theme" aria-label="Switch theme">
          <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
        <button class="btn primary" id="exportBtn">Export CSV</button>
      </div>
    </div>
  </header>

  <p class="lede" aria-live="polite"><b id="nU">0</b> units sold across <b id="nM">0</b> medications at <b id="nP">0</b> pharmacies.</p>

  <div class="mix" id="mix" hidden>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <p class="mixt" id="mixT"></p>
  </div>

  <section class="fields">
    <div class="field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="in" id="search" type="search" placeholder="Search everything" autocomplete="off" aria-label="Search" title="Press / to search">
      <button class="exact" id="exactBtn" aria-pressed="false" title="Match the exact phrase">Exact</button>
    </div>
    <div id="ddHost"></div>
    <div class="row" id="groups">
      <span class="lbl">Group by</span>
      <button class="tog" data-k="_source" aria-pressed="false">Source</button>
      <button class="tog" data-k="name" aria-pressed="false">Medication</button>
      <button class="tog" data-k="pharmacy" aria-pressed="false">Pharmacy</button>
      <button class="tog" data-k="region" aria-pressed="false">Region</button>
      <button class="tog" data-k="month" aria-pressed="false">Month</button>
      <button class="tog" data-k="unit" aria-pressed="false">Unit type</button>
      <button class="tog" data-k="method" aria-pressed="false">Method</button>
    </div>
  </section>

  <div class="banner" id="banner" hidden></div>

  <div>
    <div class="meta">
      <span id="count" aria-live="polite">Loading…</span>
      <button class="link" id="reset" hidden>Reset all</button>
      <button class="link end" id="dupBtn" hidden></button>
    </div>
    <div class="boxw">
      <div class="box" id="box" tabindex="0" role="region" aria-label="Records">
        <div class="tin" id="tin">
          <div class="head" id="head"></div>
          <div id="body"></div>
          <div id="pad"></div>
        </div>
        <div class="empty" id="empty"></div>
      </div>
      <div class="pos" id="pos" aria-hidden="true"></div>
    </div>
  </div>
</div>

<dialog id="dup">
  <div class="dh">
    <h2>Merged duplicates</h2>
    <button class="btn" id="remerge" hidden>Merge all again</button>
    <button class="btn icon" id="dupClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="db" id="dupDb">
    <table>
      <thead><tr><th>Medication</th><th>Pharmacy</th><th>Region</th><th>Rows</th><th>Units</th><th></th></tr></thead>
      <tbody id="dupBody"></tbody>
    </table>
    <div id="dupSent"></div>
  </div>
</dialog>

<script>
function Engine(post) {
  const FIELDS = ['name', 'pharmacy', 'region', 'month', 'unit', 'method'];
  const KEYS = ['pharmacy', 'region', 'month', 'method', 'unit'];
  const COLKEYS = ['_source', 'name', 'pharmacy', 'region', 'month', 'unit', 'method'];
  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const clean = v => String(v ?? '').trim();
  const store = {};
  let feedOrder = [];
  let unmerged = new Set();
  let T = emptyTable();
  let F = null;
  let V = null;
  let gen = 0;
  let caches = { rank: {}, low: {} };
  let pending = null;
  let timer = 0;

  function emptyTable() {
    const col = {}, vals = {};
    FIELDS.forEach(f => { col[f] = new Uint32Array(0); vals[f] = []; });
    return { n: 0, srcVals: [], src: new Uint8Array(0), col, vals, units: new Float64Array(0), dupRow: new Uint32Array(0), dupCnt: new Uint32Array(0), mergedRows: 0 };
  }

  class IntMap {
    constructor(expect) {
      let cap = 16;
      while (cap < expect * 2) cap *= 2;
      this.mask = cap - 1;
      this.keys = new Float64Array(cap).fill(-1);
      this.vals = new Int32Array(cap);
      this.size = 0;
    }
    reset() {
      this.keys.fill(-1);
      this.size = 0;
    }
    id(key) {
      const lo = key >>> 0;
      const hi = (key / 4294967296) >>> 0;
      let h = Math.imul(lo, 0xcc9e2d51) ^ Math.imul(hi, 0x1b873593);
      h ^= h >>> 15;
      h = Math.imul(h, 0x85ebca6b);
      h ^= h >>> 13;
      h = Math.imul(h, 0xc2b2ae35);
      h ^= h >>> 16;
      const keys = this.keys, mask = this.mask;
      let i = h & mask;
      for (;;) {
        const k = keys[i];
        if (k === key) return this.vals[i];
        if (k === -1) {
          keys[i] = key;
          this.vals[i] = this.size;
          return this.size++;
        }
        i = (i + 1) & mask;
      }
    }
  }

  function radixPerm(lo, hi, n) {
    let a = new Uint32Array(n), b = new Uint32Array(n);
    for (let i = 0; i < n; i++) a[i] = i;
    if (n < 2) return a;
    const hist = new Uint32Array(65536);
    const passes = [[lo, 0], [lo, 16]];
    if (hi) passes.push([hi, 0], [hi, 16]);
    for (const [arr, shift] of passes) {
      hist.fill(0);
      for (let i = 0; i < n; i++) hist[(arr[i] >>> shift) & 65535]++;
      if (hist[(arr[0] >>> shift) & 65535] === n) continue;
      let sum = 0;
      for (let d = 0; d < 65536; d++) {
        const c = hist[d];
        hist[d] = sum;
        sum += c;
      }
      for (let j = 0; j < n; j++) {
        const p = a[j];
        b[hist[(arr[p] >>> shift) & 65535]++] = p;
      }
      const t = a;
      a = b;
      b = t;
    }
    return a;
  }

  function group(n, parts) {
    const gid = new Int32Array(n);
    if (!n) return { gid, G: 0 };
    const acc = new Float64Array(n);
    const map = new IntMap(n);
    let prod = 1;
    for (const part of parts) {
      const sz = part.sz;
      if (sz < 2) continue;
      if (prod * sz > 4e15) {
        map.reset();
        for (let p = 0; p < n; p++) acc[p] = map.id(acc[p]);
        prod = map.size;
      }
      const codes = part.codes, idx = part.idx;
      if (idx) for (let p = 0; p < n; p++) acc[p] = acc[p] * sz + codes[idx[p]];
      else for (let p = 0; p < n; p++) acc[p] = acc[p] * sz + codes[p];
      prod *= sz;
    }
    map.reset();
    for (let p = 0; p < n; p++) gid[p] = map.id(acc[p]);
    return { gid, G: map.size };
  }

  function Builder() {
    let cap = 16384, n = 0;
    const maps = FIELDS.map(() => new Map());
    const vals = FIELDS.map(() => []);
    let codes = FIELDS.map(() => new Uint32Array(cap));
    let units = new Float64Array(cap);
    const grow = () => {
      cap *= 2;
      codes = codes.map(a => {
        const b = new Uint32Array(cap);
        b.set(a);
        return b;
      });
      const u = new Float64Array(cap);
      u.set(units);
      units = u;
    };
    return {
      add(x) {
        if (n === cap) grow();
        for (let f = 0; f < 6; f++) {
          const s = clean(x[FIELDS[f]]);
          let c = maps[f].get(s);
          if (c === undefined) {
            c = vals[f].length;
            vals[f].push(s);
            maps[f].set(s, c);
          }
          codes[f][n] = c;
        }
        units[n] = Number(x.unitSold) || 0;
        n++;
      },
      count: () => n,
      finish: () => ({ n, vals, codes: codes.map(a => a.slice(0, n)), units: units.slice(0, n) })
    };
  }

  function Scanner(add, tick) {
    let depth = 0, inStr = false, esc = false, rec = false, cont = false;
    let base = 0, recStart = 0, parts = null, first = false, bad = false;
    const batch = [];
    const flush = () => {
      if (!batch.length) return;
      let arr;
      try {
        arr = JSON.parse('[' + batch.join(',') + ']');
      } catch (e) {
        arr = [];
        for (const t of batch) {
          try { arr.push(JSON.parse(t)); } catch (e2) {}
        }
      }
      batch.length = 0;
      for (let i = 0; i < arr.length; i++) add(arr[i]);
      tick();
    };
    const emit = t => {
      batch.push(t);
      if (batch.length >= 2048) flush();
    };
    return {
      feed(s) {
        const n = s.length;
        if (!first) {
          const m = /\S/.exec(s);
          if (!m) return;
          first = true;
          if (!/[{["\-0-9ntf]/.test(m[0])) bad = true;
        }
        for (let i = 0; i < n; i++) {
          const c = s.charCodeAt(i);
          if (inStr) {
            if (esc) esc = false;
            else if (c === 92) esc = true;
            else if (c === 34) inStr = false;
            continue;
          }
          if (c === 34) {
            inStr = true;
          } else if (c === 123) {
            if (!rec && (depth === 1 || (depth === 2 && cont))) {
              rec = true;
              base = depth;
              recStart = i;
              parts = null;
            }
            depth++;
          } else if (c === 125) {
            depth--;
            if (rec && depth === base) {
              rec = false;
              if (parts) {
                parts.push(s.slice(0, i + 1));
                emit(parts.join(''));
                parts = null;
              } else {
                emit(s.slice(recStart, i + 1));
              }
            }
          } else if (c === 91) {
            if (!rec && depth === 1) cont = true;
            depth++;
          } else if (c === 93) {
            depth--;
            if (cont && !rec && depth === 1) cont = false;
          }
        }
        if (rec) {
          if (parts) parts.push(s);
          else parts = [s.slice(recStart)];
        }
      },
      end() {
        flush();
        return !bad && first && depth === 0 && !inStr;
      }
    };
  }

  const feedRows = {};
  let lastTick = 0;
  const reportProgress = (src, n) => {
    feedRows[src] = n;
    const now = Date.now();
    if (now - lastTick < 120) return;
    lastTick = now;
    let rows = 0;
    for (const k in feedRows) rows += feedRows[k];
    post({ t: 'progress', rows });
  };

  async function loadFeed(src, url) {
    let res;
    try {
      res = await fetch(url, { cache: 'no-store' });
    } catch (e) {
      throw new Error(`${src} feed is unreachable`);
    }
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error || ''; } catch (e) {}
      throw new Error(`${src} feed failed (${res.status}${detail ? ': ' + detail : ''})`);
    }
    const b = Builder();
    const scan = Scanner(b.add, () => reportProgress(src, b.count()));
    try {
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const dec = new TextDecoder('utf-8');
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          scan.feed(dec.decode(value, { stream: true }));
        }
        scan.feed(dec.decode());
      } else {
        scan.feed(await res.text());
      }
    } catch (e) {
      throw new Error(`${src} feed was interrupted`);
    }
    if (!scan.end()) throw new Error(`${src} feed returned invalid data`);
    return b.finish();
  }

  async function load(feeds) {
    feedOrder = feeds.map(f => f[0]);
    for (const k in feedRows) delete feedRows[k];
    const results = await Promise.allSettled(feeds.map(([s, u]) => loadFeed(s, u)));
    const failed = {};
    results.forEach((r, i) => {
      const s = feeds[i][0];
      if (r.status === 'fulfilled') store[s] = r.value;
      else failed[s] = r.reason.message;
    });
    rebuild();
    post(builtInfo());
    post({ t: 'loaded', failed });
  }

  function builtInfo() {
    return { t: 'built', gen, all: T.n, groups: T.dupRow.length, merged: T.mergedRows, unmerged: unmerged.size };
  }

  function rebuild() {
    gen++;
    caches = { rank: {}, low: {} };
    F = null;
    V = null;
    const srcVals = feedOrder.filter(s => store[s] && store[s].n > 0);
    let N = 0;
    for (const s of srcVals) N += store[s].n;
    const gv = FIELDS.map(() => []);
    const gm = FIELDS.map(() => new Map());
    const Rsrc = new Uint8Array(N);
    const Rcol = FIELDS.map(() => new Uint32Array(N));
    const Runits = new Float64Array(N);
    let off = 0;
    srcVals.forEach((s, si) => {
      const d = store[s];
      Rsrc.fill(si, off, off + d.n);
      for (let f = 0; f < 6; f++) {
        const lv = d.vals[f];
        const remap = new Uint32Array(lv.length);
        for (let c = 0; c < lv.length; c++) {
          let g = gm[f].get(lv[c]);
          if (g === undefined) {
            g = gv[f].length;
            gv[f].push(lv[c]);
            gm[f].set(lv[c], g);
          }
          remap[c] = g;
        }
        const from = d.codes[f], to = Rcol[f];
        for (let i = 0; i < d.n; i++) to[off + i] = remap[from[i]];
      }
      Runits.set(d.units, off);
      off += d.n;
    });

    const parts = [{ codes: Rsrc, sz: srcVals.length }];
    for (let f = 0; f < 6; f++) parts.push({ codes: Rcol[f], sz: gv[f].length });
    const { gid, G } = group(N, parts);

    const cnt = new Uint32Array(G), first = new Int32Array(G).fill(-1), sum = new Float64Array(G);
    for (let i = 0; i < N; i++) {
      const g = gid[i];
      if (cnt[g]++ === 0) first[g] = i;
      sum[g] += Runits[i];
    }

    const mergedG = new Uint8Array(G);
    let dupN = 0, mergedRows = 0;
    for (let g = 0; g < G; g++) {
      if (cnt[g] < 2) continue;
      if (unmerged.size) {
        const r = first[g];
        const h = [srcVals[Rsrc[r]], gv[0][Rcol[0][r]], gv[1][Rcol[1][r]], gv[2][Rcol[2][r]], gv[3][Rcol[3][r]], gv[4][Rcol[4][r]], gv[5][Rcol[5][r]]].join('\u0001');
        if (unmerged.has(h)) continue;
      }
      mergedG[g] = 1;
      dupN++;
      mergedRows += cnt[g] - 1;
    }

    const start = new Uint32Array(G + 1);
    for (let g = 0; g < G; g++) start[g + 1] = start[g] + (mergedG[g] ? 1 : cnt[g]);
    const M = start[G];
    const fSrc = new Uint8Array(M), fCol = FIELDS.map(() => new Uint32Array(M)), fUnits = new Float64Array(M);
    const cur = new Uint32Array(G);
    const dupRow = new Uint32Array(dupN), dupCnt = new Uint32Array(dupN);
    let di = 0;
    for (let i = 0; i < N; i++) {
      const g = gid[i];
      let p;
      if (mergedG[g]) {
        if (first[g] !== i) continue;
        p = start[g];
        fUnits[p] = sum[g];
        dupRow[di] = p;
        dupCnt[di] = cnt[g];
        di++;
      } else {
        p = start[g] + cur[g]++;
        fUnits[p] = Runits[i];
      }
      fSrc[p] = Rsrc[i];
      for (let f = 0; f < 6; f++) fCol[f][p] = Rcol[f][i];
    }

    const col = {}, vals = {};
    FIELDS.forEach((f, i) => { col[f] = fCol[i]; vals[f] = gv[i]; });
    T = { n: M, srcVals, src: fSrc, col, vals, units: fUnits, dupRow, dupCnt, mergedRows };
  }

  function valsOf(key) {
    return key === '_source' ? T.srcVals : T.vals[key];
  }

  function codesOf(key) {
    return key === '_source' ? T.src : T.col[key];
  }

  function lowOf(key) {
    if (!caches.low[key]) caches.low[key] = valsOf(key).map(s => s.toLowerCase());
    return caches.low[key];
  }

  function rankOf(key) {
    let r = caches.rank[key];
    if (r) return r;
    const v = valsOf(key);
    const n = v.length;
    const order = new Array(n);
    for (let i = 0; i < n; i++) order[i] = i;
    order.sort((a, b) => collator.compare(v[a], v[b]) || a - b);
    const rank = new Uint32Array(n);
    let k = 0;
    for (let i = 0; i < n; i++) {
      if (i && collator.compare(v[order[i - 1]], v[order[i]]) !== 0) k++;
      rank[order[i]] = k;
    }
    r = caches.rank[key] = { rank, order, count: n ? k + 1 : 0 };
    return r;
  }

  function compileSearch(q, exact) {
    if (!q) return null;
    const spaced = /\s/.test(q);
    const words = exact && !spaced ? [q] : q.split(/\s+/);
    const phrase = exact && spaced ? q : null;
    const keys = ['_source', ...FIELDS];
    const groups = [];
    for (let g = 0; g < words.length; g += 30) {
      const part = words.slice(g, g + 30);
      const full = (1 << part.length) - 1;
      const masks = keys.map(k => {
        const low = lowOf(k);
        const m = new Int32Array(low.length);
        for (let c = 0; c < low.length; c++) {
          let bits = 0;
          const s = low[c];
          for (let t = 0; t < part.length; t++) if (s.includes(part[t])) bits |= 1 << t;
          m[c] = bits;
        }
        return m;
      });
      groups.push({ full, masks });
    }
    return { groups, phrase };
  }

  function scanRows(m, f) {
    const n = T.n;
    const sp = compileSearch(m.q.trim().toLowerCase(), m.exact);
    let srcWant = -1;
    if (m.src !== 'all') {
      const i = T.srcVals.indexOf(m.src);
      srcWant = i < 0 ? -2 : i;
    }
    const srcA = T.src, c0 = T.col.name, c1 = T.col.pharmacy, c2 = T.col.region, c3 = T.col.month, c4 = T.col.unit, c5 = T.col.method;
    const kc = KEYS.map(k => T.col[k]);
    const actJ = [], actCol = [], actWant = [], actBit = [];
    KEYS.forEach((k, j) => {
      if (!f[k]) return;
      const i = T.vals[k].indexOf(f[k]);
      actJ.push(j);
      actCol.push(kc[j]);
      actWant.push(i < 0 ? -2 : i);
      actBit.push(4 << j);
    });
    const nAct = actJ.length;
    let sMode = 0, ms, m0, m1, m2, m3, m4, m5, full = 0, lowS, lowN, lowP, lowR, lowM, lowU, lowMe, general = null;
    if (sp) {
      if (sp.groups.length === 1 && !sp.phrase) {
        sMode = 1;
        [ms, m0, m1, m2, m3, m4, m5] = sp.groups[0].masks;
        full = sp.groups[0].full;
      } else {
        sMode = 2;
        lowS = lowOf('_source');
        lowN = lowOf('name');
        lowP = lowOf('pharmacy');
        lowR = lowOf('region');
        lowM = lowOf('month');
        lowU = lowOf('unit');
        lowMe = lowOf('method');
        const groups = sp.groups, phrase = sp.phrase;
        general = i => {
          for (let g = 0; g < groups.length; g++) {
            const gm = groups[g].masks;
            if ((gm[0][srcA[i]] | gm[1][c0[i]] | gm[2][c1[i]] | gm[3][c2[i]] | gm[4][c3[i]] | gm[5][c4[i]] | gm[6][c5[i]]) !== groups[g].full) return false;
          }
          if (phrase) {
            const s = lowS[srcA[i]] + ' ' + lowN[c0[i]] + ' ' + lowP[c1[i]] + ' ' + lowR[c2[i]] + ' ' + lowM[c3[i]] + ' ' + lowMe[c5[i]] + ' ' + lowU[c4[i]];
            if (!s.includes(phrase)) return false;
          }
          return true;
        };
      }
    }
    const seen = KEYS.map(k => new Int32Array(T.vals[k].length));
    const srcU = new Float64Array(T.srcVals.length);
    const medV = new Uint8Array(T.vals.name.length), phV = new Uint8Array(T.vals.pharmacy.length);
    const out = new Uint32Array(n);
    const U = T.units;
    const k0 = kc[0], k1 = kc[1], k2 = kc[2], k3 = kc[3], k4 = kc[4];
    const s0 = seen[0], s1 = seen[1], s2 = seen[2], s3 = seen[3], s4 = seen[4];
    let cnt = 0, units = 0;
    for (let i = 0; i < n; i++) {
      let mm = 0;
      if (srcWant !== -1 && srcA[i] !== srcWant) mm = 1;
      if (sMode === 1) {
        if ((ms[srcA[i]] | m0[c0[i]] | m1[c1[i]] | m2[c2[i]] | m3[c3[i]] | m4[c4[i]] | m5[c5[i]]) !== full) mm |= 2;
      } else if (sMode === 2) {
        if (!general(i)) mm |= 2;
      }
      for (let j = 0; j < nAct; j++) if (actCol[j][i] !== actWant[j]) mm |= actBit[j];
      if (mm === 0) {
        out[cnt++] = i;
        units += U[i];
        srcU[srcA[i]] += U[i];
        medV[c0[i]] = 1;
        phV[k0[i]] = 1;
        if (!s0[k0[i]]) s0[k0[i]] = i + 1;
        if (!s1[k1[i]]) s1[k1[i]] = i + 1;
        if (!s2[k2[i]]) s2[k2[i]] = i + 1;
        if (!s3[k3[i]]) s3[k3[i]] = i + 1;
        if (!s4[k4[i]]) s4[k4[i]] = i + 1;
      } else if (mm >= 4 && (mm & (mm - 1)) === 0) {
        const j = 31 - Math.clz32(mm) - 2;
        const sj = seen[j], cj = kc[j][i];
        if (!sj[cj]) sj[cj] = i + 1;
      }
    }
    let stale = false;
    for (let a = 0; a < nAct; a++) {
      if (actWant[a] < 0 || !seen[actJ[a]][actWant[a]]) {
        f[KEYS[actJ[a]]] = '';
        stale = true;
      }
    }
    if (stale) return null;
    let meds = 0, pharms = 0;
    for (let c = 0; c < medV.length; c++) meds += medV[c];
    for (let c = 0; c < phV.length; c++) pharms += phV[c];
    const opts = {};
    KEYS.forEach((k, j) => {
      const rank = rankOf(k).rank, vals = T.vals[k], sj = seen[j], codes = [];
      for (let c = 0; c < sj.length; c++) if (sj[c] && vals[c]) codes.push(c);
      codes.sort((a, b) => rank[a] - rank[b] || sj[a] - sj[b]);
      opts[k] = codes.map(c => vals[c]);
    });
    return { out, cnt, units, meds, pharms, opts, srcU };
  }

  function runFilter(m) {
    const f = { ...m.f };
    let r = null;
    for (let a = 0; a <= KEYS.length && !r; a++) r = scanRows(m, f);
    r.f = f;
    return r;
  }

  function shape(r, by) {
    const out = r.out, cnt = r.cnt;
    let rep, su;
    if (by.length) {
      const { gid, G } = group(cnt, by.map(k => ({ codes: codesOf(k), sz: valsOf(k).length, idx: out })));
      rep = new Uint32Array(G);
      su = new Float64Array(G);
      const seenG = new Uint8Array(G);
      for (let p = 0; p < cnt; p++) {
        const g = gid[p];
        if (!seenG[g]) {
          seenG[g] = 1;
          rep[g] = out[p];
        }
        su[g] += T.units[out[p]];
      }
    } else {
      rep = out.subarray(0, cnt);
      su = new Float64Array(cnt);
      for (let p = 0; p < cnt; p++) su[p] = T.units[out[p]];
    }
    let max = 0;
    for (let i = 0; i < su.length; i++) if (su[i] > max) max = su[i];
    return { rep, su, max };
  }

  function sortPerm(sh, key, dir) {
    const n = sh.rep.length;
    if (!key || n < 2) return null;
    if (key === 'unitSold') {
      const u32 = new Uint32Array(sh.su.buffer, sh.su.byteOffset, n * 2);
      const lo = new Uint32Array(n), hi = new Uint32Array(n);
      for (let i = 0; i < n; i++) {
        let l = u32[2 * i], h = u32[2 * i + 1];
        if (h & 0x80000000) {
          h = ~h >>> 0;
          l = ~l >>> 0;
        } else {
          h = (h | 0x80000000) >>> 0;
        }
        if (dir < 0) {
          h = ~h >>> 0;
          l = ~l >>> 0;
        }
        lo[i] = l;
        hi[i] = h;
      }
      return radixPerm(lo, hi, n);
    }
    const codes = codesOf(key), rk = rankOf(key), top = rk.count - 1;
    const keys = new Uint32Array(n);
    for (let p = 0; p < n; p++) {
      const r = rk.rank[codes[sh.rep[p]]];
      keys[p] = dir < 0 ? top - r : r;
    }
    return radixPerm(keys, null, n);
  }

  function derive(m) {
    const by = m.by;
    const inKey = JSON.stringify([m.q, m.exact, m.src, m.f, by]);
    if (!F || (F.key !== inKey && F.altKey !== inKey)) {
      const r = runFilter(m);
      r.key = JSON.stringify([m.q, m.exact, m.src, r.f, by]);
      r.shape = null;
      F = r;
      F.altKey = inKey;
    }
    if (!F.shape) F.shape = shape(F, by);
    const valid = by.length ? by.concat('unitSold') : COLKEYS.concat('unitSold');
    const sortKey = valid.includes(m.sort.key) ? m.sort.key : null;
    const perm = sortPerm(F.shape, sortKey, m.sort.dir);
    V = { ver: m.ver, by, rep: F.shape.rep, su: F.shape.su, perm };
    post({ t: 'derived', ver: m.ver, all: T.n, shown: F.shape.rep.length, units: F.units, meds: F.meds, pharms: F.pharms, srcNames: T.srcVals, srcUnits: Array.from(F.srcU), max: F.shape.max, opts: F.opts, f: F.f, sortKey });
  }

  function rows(m) {
    if (!V || V.ver !== m.ver) {
      post({ t: 'rows', ver: m.ver, stale: true });
      return;
    }
    const keys = V.by.length ? COLKEYS.filter(k => V.by.includes(k)) : COLKEYS;
    const K = keys.length;
    const n = V.rep.length;
    const end = Math.min(n, m.start + m.count);
    const count = Math.max(0, end - m.start);
    const v = new Array(count * K), u = new Array(count), s = new Array(count);
    const showSrc = !V.by.length || V.by.includes('_source');
    const kv = keys.map(valsOf), kcodes = keys.map(codesOf);
    for (let i = 0; i < count; i++) {
      const pos = m.start + i;
      const p = V.perm ? V.perm[pos] : pos;
      const r = V.rep[p];
      for (let k = 0; k < K; k++) v[i * K + k] = kv[k][kcodes[k][r]];
      u[i] = V.su[p];
      s[i] = showSrc ? T.srcVals[T.src[r]] : '';
    }
    post({ t: 'rows', ver: m.ver, start: m.start, count, K, v, u, s });
  }

  function dups(m) {
    const total = T.dupRow.length;
    const end = Math.min(total, m.offset + m.limit);
    const items = [];
    for (let d = m.offset; d < end; d++) {
      const r = T.dupRow[d];
      items.push([T.vals.name[T.col.name[r]], T.vals.pharmacy[T.col.pharmacy[r]], T.vals.region[T.col.region[r]], T.dupCnt[d], T.units[r]]);
    }
    post({ t: 'dups', gen, offset: m.offset, total, items });
  }

  function unmerge(m) {
    if (m.gen !== gen) return;
    const r = T.dupRow[m.i];
    if (r === undefined) return;
    unmerged.add([T.srcVals[T.src[r]], T.vals.name[T.col.name[r]], T.vals.pharmacy[T.col.pharmacy[r]], T.vals.region[T.col.region[r]], T.vals.month[T.col.month[r]], T.vals.unit[T.col.unit[r]], T.vals.method[T.col.method[r]]].join('\u0001'));
    rebuild();
    post(builtInfo());
  }

  function exportCsv(m) {
    if (!V || V.ver !== m.ver) {
      post({ t: 'exported', stale: true });
      return;
    }
    const esc = v => {
      let s = String(v ?? '');
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const cols = m.cols;
    const cv = cols.map(c => c.num ? null : valsOf(c.k));
    const cc = cols.map(c => c.num ? null : codesOf(c.k));
    const ec = cols.map((c, i) => c.num ? null : new Array(cv[i].length));
    const parts = ['﻿' + cols.map(c => esc(c.l)).join(',')];
    let buf = [];
    const n = V.rep.length;
    for (let i = 0; i < n; i++) {
      const p = V.perm ? V.perm[i] : i;
      const r = V.rep[p];
      let line = '';
      for (let ci = 0; ci < cols.length; ci++) {
        if (ci) line += ',';
        if (cols[ci].num) {
          line += String(V.su[p] ?? 0);
        } else {
          const code = cc[ci][r];
          let e = ec[ci][code];
          if (e === undefined) e = ec[ci][code] = esc(cv[ci][code]);
          line += e;
        }
      }
      buf.push(line);
      if (buf.length === 20000) {
        parts.push('\r\n' + buf.join('\r\n'));
        buf = [];
      }
    }
    if (buf.length) parts.push('\r\n' + buf.join('\r\n'));
    post({ t: 'exported', blob: new Blob(parts, { type: 'text/csv;charset=utf-8' }) });
  }

  function flushPending() {
    timer = 0;
    const m = pending;
    pending = null;
    if (m) derive(m);
  }

  function handle(m) {
    switch (m.t) {
      case 'load':
        load(m.feeds);
        break;
      case 'derive':
        pending = m;
        if (!timer) timer = setTimeout(flushPending, 0);
        break;
      case 'rows':
        if (pending) flushPending();
        rows(m);
        break;
      case 'dups':
        dups(m);
        break;
      case 'unmerge':
        unmerge(m);
        break;
      case 'remerge':
        unmerged = new Set();
        rebuild();
        post(builtInfo());
        break;
      case 'export':
        if (pending) flushPending();
        exportCsv(m);
        break;
    }
  }

  post({ t: 'ready' });
  return { handle, snapshot: () => ({ T, V, F }) };
}

let link = null;
const send = m => link.send(m);

function openLink() {
  let ready = false;
  const log = [];
  const inline = () => {
    const clone = typeof structuredClone === 'function' ? structuredClone : x => x;
    const eng = Engine(m => queueMicrotask(() => onMsg(clone(m))));
    link = { send: m => queueMicrotask(() => eng.handle(m)) };
    log.splice(0).forEach(m => link.send(m));
  };
  try {
    const src = 'const E=' + Engine.toString() + ';const e=E(m=>postMessage(m));onmessage=ev=>e.handle(ev.data);';
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = ev => {
      if (ev.data.t === 'ready') { ready = true; log.length = 0; }
      onMsg(ev.data);
    };
    w.onerror = ev => {
      ev.preventDefault();
      if (!ready) { w.terminate(); inline(); } else engineFailed();
    };
    link = { send: m => { if (!ready) log.push(m); w.postMessage(m); } };
  } catch (e) {
    inline();
  }
}

function engineFailed() {
  S.dead = true;
  S.failed = { engine: 'The data engine stopped unexpectedly' };
  S.syncing = false;
  S.loaded = true;

function onMsg(m) {
  switch (m.t) {
    case 'progress':
      S.rows = m.rows;
      if (S.syncing) paintStatus();
      break;
    case 'built':
      S.gen = m.gen;
      S.dg = { groups: m.groups, merged: m.merged, unmerged: m.unmerged };
      paintDupNotice();
      derive();
      break;
    case 'loaded':
      S.failed = m.failed;
      if (Object.keys(S.failed).length < FEEDS.length) S.last = new Date();
      S.syncing = false;
      S.loaded = true;
      paintStatus();
      paintBanner();
      break;
    case 'derived': onDerived(m); break;
    case 'rows': onRows(m); break;
    case 'dups': onDups(m); break;
    case 'exported': onExported(m); break;
  }
}

function makeDropdown(k, onPick) {
  const host = document.createElement('div');

  const btn = host.querySelector('.dd-btn'), val = host.querySelector('.dd-v'), clear = host.querySelector('.dd-x');
  const panel = host.querySelector('.dd-panel'), q = host.querySelector('.dd-q'), list = host.querySelector('.dd-list');
  const d = { host, opts: [], val: '', idx: 0, view: [] };

  const setIdx = (i, scroll = true) => {
    const items = list.children;

    i = Math.max(0, Math.min(d.view.length - 1, i));
    items[d.idx]?.classList.remove('act');
    d.idx = i;

    if (scroll) items[i].scrollIntoView({ block: 'nearest' });
  };

  const render = () => {
    const term = q.value.trim().toLowerCase();
    let found = term ? d.opts.filter(o => o.toLowerCase().includes(term)) : d.opts;
    let more = 0;
    if (found.length > OPT_CAP) {
      more = found.length - OPT_CAP;
      let head = found.slice(0, OPT_CAP);
      if (d.val && !head.includes(d.val) && found.includes(d.val)) head = [d.val, ...head.slice(0, OPT_CAP - 1)];
      found = head;
    }
    d.view = [{ v: '', t: PLACE[k] }, ...found.map(o => ({ v: o, t: o }))];
    const nodes = d.view.map((o, i) => {
      const li = document.createElement('li');

      li.className = 'dd-o' + (o.v === d.val ? ' sel' : '');
      li.textContent = o.t;
      li.addEventListener('mousedown', e => e.preventDefault());
      li.addEventListener('click', () => pick(o.v));
      li.addEventListener('mousemove', () => { if (d.idx !== i) setIdx(i, false); });

function load() {

function derive() {
  S.ver++;

}

function onDerived(m) {
  if (m.ver !== S.ver) return;
  S.applied = m.ver;
  S.f = m.f;
  S.allN = m.all;
  S.count = m.shown;
  S.units = m.units;
  S.meds = m.meds;
  S.pharms = m.pharms;
  S.max = m.max;
  S.srcNames = m.srcNames;
  S.srcUnits = m.srcUnits;
  KEYS.forEach(k => S.dd[k].update(m.opts[k], S.f[k]));
  S.sort.key = m.sortKey;
  const cols = S.by.length ? COLS.filter(c => S.by.includes(c.k) || c.num) : COLS;
  const key = cols.map(c => c.k).join('-');

function makeNode() {

function fill(node, w, j) {
  const cols = S.cols;
  let c = j * w.K;
  for (let ci = 0; ci < cols.length; ci++) {
    const col = cols[ci];
    if (col.num) {
      node.sp.textContent = FMT.format(w.u[j]);
      node.bar.style.width = (S.max > 0 ? Math.max(0, w.u[j]) / S.max * 100 : 0) + '%';
      node.bar.dataset.s = w.s[j] || '';
    } else {
      const t = w.v[c++];
      const cell = node.cells[ci];
      if (col.k === '_source') {
        cell.dataset.s = t;
        cell.textContent = t;
      } else {
        cell.textContent = t || '—';
      }
    }
  }

function ensurePool() {
  const need = Math.ceil($('box').clientHeight / ROW) + 4;
  while (S.nodes.length < need) S.nodes.push(makeNode());

function geometry() {
  const vh = Math.max(0, $('box').clientHeight - HEAD);
  const total = S.count * ROW;
  const v = total > CAP;
  S.geo = { v, vh, ratio: v ? (total - vh) / CAP : 1 };
  const body = $('body');
  body.classList.toggle('v', v);
  body.style.height = (v ? vh : total) + 'px';
  $('pad').style.height = (v ? CAP : 0) + 'px';
}

function viewRange() {
  const L = S.nodes.length, n = S.count, g = S.geo;
  const st = $('box').scrollTop;
  const top = g.v ? Math.min(st * g.ratio, Math.max(0, n * ROW - g.vh)) : st;
  const first = Math.floor(top / ROW);
  const start = Math.max(0, first - 1);
  return { top, first, start, end: Math.min(n - 1, start + L - 1) };
}

function liveWin() {
  const w = S.win;
  return w && w.ver === S.ver && w.K === S.cols.length - 1 ? w : null;
}

function needRows() {
  const L = S.nodes.length, n = S.count;
  if (!L || !n || S.busy) return;
  const v = viewRange();
  const w = liveWin();
  if (w && v.start >= w.start && v.end < w.start + w.count) return;
  const lead = Math.max(L, 24);
  const start = Math.max(0, v.start - lead);
  const count = Math.min(n - start, L + lead * 3);
  S.busy = true;
  send({ t: 'rows', ver: S.ver, start, count });
}

function onRows(m) {
  S.busy = false;
  if (m.stale) return;
  if (m.ver !== S.ver) { needRows(); return; }
  S.win = m;
  paint(true);
  needRows();
}

function paint(force) {
  const L = S.nodes.length;
  if (!L) return;
  const g = S.geo;
  const w = liveWin();
  const v = viewRange();
  const off = g.v ? v.top : 0;
  const frame = ++S.frame;
  for (let i = v.start; i <= v.end; i++) {
    const node = S.nodes[i % L];
    node.f = frame;
    const j = w ? i - w.start : -1;
    const has = !!w && j >= 0 && j < w.count;
    if (force || node.i !== i || node.ok !== has) {
      node.i = i;
      node.ok = has;
      node.el.hidden = false;
      node.el.classList.toggle('w', !has);
      if (has) fill(node, w, j);
      if (!g.v) node.el.style.transform = `translateY(${i * ROW}px)`;
    }
    if (g.v) node.el.style.transform = `translateY(${i * ROW - off}px)`;
  }
  for (const node of S.nodes) {
    if (node.f !== frame) { node.i = -1; node.ok = false; node.el.hidden = true; }
  }
}

let posTimer = 0;
function showPos() {
  const n = S.count;
  if (!n) return;
  const rows = Math.max(1, Math.ceil(S.geo.vh / ROW));
  if (n <= rows * 2) return;
  const v = viewRange();
  const first = Math.min(v.first, Math.max(0, n - rows));
  const el = $('pos');
  el.textContent = `${FMT.format(first + 1)}–${FMT.format(Math.min(n, first + rows))} of ${FMT.format(n)}`;
  el.classList.add('on');
  clearTimeout(posTimer);
  posTimer = setTimeout(() => el.classList.remove('on'), 900);
}

function show() {
  tween($('nU'), S.units);
  tween($('nM'), S.meds);
  tween($('nP'), S.pharms);
  geometry();
  if (S.toTop) { $('box').scrollTop = 0; S.toTop = false; }

  const n = S.count;
  const grouped = S.by.length > 0;
  $('count').textContent = !S.loaded ? 'Loading…'
    : `${FMT.format(n)} ${grouped ? (n === 1 ? 'group' : 'groups') : (n === 1 ? 'record' : 'records')}` +
      (!grouped && n !== S.allN ? ` of ${FMT.format(S.allN)}` : '');

  $('reset').hidden = !(S.q || S.src !== 'all' || S.by.length || KEYS.some(k => S.f[k]));
  paintMix();
  paintEmpty();
  if (n) needRows(); else paint(true);
}

function paintMix() {
  const el = $('mix');
  const total = S.srcUnits.reduce((a, u) => a + Math.max(0, u), 0);
  el.hidden = !(total > 0);
  if (!(total > 0)) return;
  FEEDS.forEach(([s], idx) => {
    const at = S.srcNames.indexOf(s);
    const u = at < 0 ? 0 : Math.max(0, S.srcUnits[at]);
    const seg = $('bar').children[idx];
    seg.style.setProperty('--g', u);
    seg.hidden = !u;
    const tag = $('mixT').children[idx];
    tag.hidden = !u;
    tag.textContent = `${s} ${Math.round(u / total * 100)}%`;
  });
}

function paintEmpty() {
  const el = $('empty');
  el.replaceChildren();
  if (S.count) { el.hidden = true; return; }
  el.hidden = false;
  const msg = document.createElement('p');
  if (!S.loaded) { msg.textContent = 'Loading data…'; el.append(msg); return; }
  if (!S.allN) { msg.textContent = 'No records yet. Check the connection, then sync again.'; el.append(msg); return; }
  msg.textContent = 'Nothing matches these filters.';
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = 'Reset all';
  b.addEventListener('click', resetAll);
  el.append(msg, b);
}

function paintHead() {
  $('head').querySelectorAll('button').forEach(b => {
    if (b.dataset.k === S.sort.key) b.setAttribute('aria-sort', S.sort.dir === 1 ? 'ascending' : 'descending');
    else b.removeAttribute('aria-sort');
  });
}

function tween(el, to) {
  const from = Number(el.dataset.v) || 0;
  el.dataset.v = to;
  cancelAnimationFrame(el._raf);
  if (reduced || from === to) { el.textContent = FMT.format(to); return; }
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min((now - t0) / 450, 1);
    el.textContent = FMT.format(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
    if (p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

function paintStatus() {
  const failedAll = Object.keys(S.failed).length === FEEDS.length;
  $('dot').className = 'dot' + (S.syncing ? ' busy' : failedAll ? ' err' : S.last ? ' ok' : '');
  $('mark').classList.toggle('busy', S.syncing);
  $('syncBtn').classList.toggle('spin', S.syncing);
  let text = 'Connecting';
  if (S.syncing) text = S.rows ? `Syncing ${COMPACT.format(S.rows)}` : 'Syncing';
  else if (failedAll) text = 'Offline';
  else if (S.last) text = 'Updated ' + S.last.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('stat').textContent = text;
}

function paintBanner() {
  const el = $('banner');
  const msgs = Object.values(S.failed);
  if (!msgs.length) { el.hidden = true; return; }
  const span = document.createElement('span');
  span.textContent = msgs.join('. ') + '.' + (S.allN ? ' Showing the last data received.' : '');
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = S.dead ? 'Reload' : 'Try again';
  b.addEventListener('click', S.dead ? () => location.reload() : load);
  el.replaceChildren(span, b);
  el.hidden = false;
}

function paintDupNotice() {
  const btn = $('dupBtn');
  const { groups, merged, unmerged } = S.dg;
  btn.hidden = !(groups || unmerged);
  btn.textContent = merged ? `${FMT.format(merged)} duplicate${merged > 1 ? 's' : ''} merged` : 'Duplicates unmerged';
  $('remerge').hidden = !unmerged;
  if ($('dup').open) {
    if (!groups && !unmerged) $('dup').close();
    else loadDups(0);
  }
}

function loadDups(offset) {
  S.dupBusy = true;
  send({ t: 'dups', offset, limit: 200 });
}

function onDups(m) {
  S.dupBusy = false;
  if (m.gen !== S.gen || !$('dup').open) return;
  const body = $('dupBody');
  if (m.offset === 0) body.replaceChildren();
  const frag = document.createDocumentFragment();
  m.items.forEach((it, n) => {
    const tr = document.createElement('tr');
    [it[0], it[1], it[2], it[3], FMT.format(it[4])].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = 'Unmerge';
    const at = m.offset + n;
    b.addEventListener('click', () => send({ t: 'unmerge', gen: S.gen, i: at }));
    td.appendChild(b);
    tr.appendChild(td);
    frag.appendChild(tr);
  });
  body.appendChild(frag);
  S.dupNext = m.offset + m.items.length;
  S.dupTotal = m.total;
  const sent = $('dupSent');
  S.dupIO.unobserve(sent);
  S.dupIO.observe(sent);
}

function placeSeg() {
  const b = $('seg').querySelector('[aria-pressed=true]');
  if (!b) return;
  $('seg').style.setProperty('--x', b.offsetLeft + 'px');
  $('seg').style.setProperty('--w', b.offsetWidth + 'px');
}

function setSource(v) {
  S.src = v;
  $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  placeSeg();
}

function setAuto(on) {
  S.auto = on;
  store('lx-auto', on ? '1' : '0');
  clearInterval(S.timer);
  S.timer = on ? setInterval(() => { if (!document.hidden) load(); }, EVERY) : null;
  $('autoBtn').setAttribute('aria-checked', String(on));
}

function resetAll() {
  S.q = '';
  S.exact = false;
  S.f = blankFilters();
  S.by = [];
  S.sort = { key: null, dir: 1 };
  S.toTop = true;
  $('search').value = '';
  $('exactBtn').setAttribute('aria-pressed', 'false');
  $('groups').querySelectorAll('.tog').forEach(c => c.setAttribute('aria-pressed', 'false'));
  setSource('all');
  derive();
}

function exportCSV() {
  if (S.exporting) return;
  if (S.applied !== S.ver) { S.wantExport = true; return; }
  S.exporting = true;
  $('exportBtn').disabled = true;
  send({ t: 'export', ver: S.ver, cols: S.cols.map(c => ({ k: c.k, l: c.l, num: !!c.num })) });
}

function onExported(m) {
  S.exporting = false;
  $('exportBtn').disabled = false;
  if (m.stale || !m.blob) return;
  const url = URL.createObjectURL(m.blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: `LX_Export_${new Date().toISOString().slice(0, 10)}.csv` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function bind() {
  KEYS.forEach(k => {
    S.dd[k] = makeDropdown(k, (key, v) => { S.f[key] = v; S.toTop = true; derive(); });
    $('ddHost').appendChild(S.dd[k].host);
  });
  FEEDS.forEach(([s]) => {
    const seg = document.createElement('i');
    seg.dataset.s = s;
    $('bar').appendChild(seg);
    const tag = document.createElement('span');
    tag.dataset.s = s;
    $('mixT').appendChild(tag);
  });

  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    setSource(b.dataset.v);
    S.toTop = true;
    derive();
  });
  new ResizeObserver(placeSeg).observe($('seg'));
  MQ.addEventListener('change', () => { applyRow(); S.colsKey = ''; derive(); });
  $('syncBtn').addEventListener('click', load);
  $('autoBtn').addEventListener('click', () => setAuto(!S.auto));
  $('exportBtn').addEventListener('click', exportCSV);
  $('themeBtn').addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    $('tc').content = t === 'dark' ? '#151813' : '#eff1e9';
    store('lx-theme', t);
  });

  $('search').addEventListener('input', debounce(e => { S.q = e.target.value; S.toTop = true; derive(); }, 90));
  $('exactBtn').addEventListener('click', () => {
    S.exact = !S.exact;
    $('exactBtn').setAttribute('aria-pressed', String(S.exact));
    if (S.q.trim()) { S.toTop = true; derive(); }
  });

  $('groups').addEventListener('click', e => {
    const c = e.target.closest('.tog');
    if (!c) return;
    const i = S.by.indexOf(c.dataset.k);
    if (i > -1) S.by.splice(i, 1); else S.by.push(c.dataset.k);
    c.setAttribute('aria-pressed', String(i === -1));
    S.toTop = true;
    derive();
  });
  $('reset').addEventListener('click', resetAll);

  S.dupIO = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting) && !S.dupBusy && S.dupNext < S.dupTotal && $('dup').open) loadDups(S.dupNext);
  }, { root: $('dupDb') });
  $('dupBtn').addEventListener('click', () => {
    S.dupNext = 0;
    S.dupTotal = 0;
    $('dupBody').replaceChildren();
    $('dup').showModal();
    loadDups(0);
  });
  $('dupClose').addEventListener('click', () => $('dup').close());
  $('remerge').addEventListener('click', () => send({ t: 'remerge' }));
  $('dup').addEventListener('click', e => { if (e.target === $('dup')) $('dup').close(); });

  let raf = 0;
  $('box').addEventListener('scroll', () => {
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      paint(false);
      needRows();
      showPos();
    });
  }, { passive: true });
  new ResizeObserver(() => {
    if (!S.nodes.length) return;
    ensurePool();
    geometry();
    paint(true);
    needRows();
  }).observe($('box'));

  document.addEventListener('keydown', e => {
    const tag = (document.activeElement || {}).tagName;
    if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(tag) && !$('dup').open) {
      e.preventDefault();
      $('search').focus();
    } else if (e.key === 'Escape' && document.activeElement === $('search') && $('search').value) {
      $('search').value = '';
      S.q = '';
      S.toTop = true;
      derive();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.auto && S.last && Date.now() - S.last > EVERY) load();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  openLink();
  bind();
  setAuto(store('lx-auto') === '1');
  derive();
  load();
});
</script>
</body>
</html>
