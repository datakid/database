<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LX Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
try {
  var t = localStorage.getItem('lx-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root{--bg:#f7f8f8;--surf:#fff;--ink:#1d2427;--mute:#778286;--faint:#a8b1b4;--line:#e5e9ea;--line2:#d2d9db;--hover:#eff2f2;--wf:#86a5c2;--st:#dcb590;--err:#cf9792;--r:8px;--rl:14px;--ui:'Hanken Grotesk',system-ui,sans-serif;--pop:0 18px 44px -20px rgba(29,36,39,.3);color-scheme:light}
[data-theme=dark]{--bg:#101415;--surf:#171c1e;--ink:#e6ebec;--mute:#8a9598;--faint:#5a6568;--line:#232a2c;--line2:#323b3e;--hover:#161b1d;--wf:#86a7c4;--st:#d9b08c;--err:#c98a86;--pop:0 18px 44px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:15px/1.5 var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.page{--pad:clamp(1.25rem,4vw,3.25rem);max-width:1240px;margin:0 auto;padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr);gap:2rem}
.top{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.7rem}
.mark{width:30px;height:30px;flex:none}
.mark.busy{animation:spin 1.1s linear infinite}
h1{font:600 1.05rem/1 var(--ui);letter-spacing:-.01em}
.stat{display:flex;align-items:center;gap:.45rem;color:var(--mute);font-size:.82rem;margin-left:.5rem;padding-left:1rem;border-left:1px solid var(--line2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--wf)}
.dot.err{background:var(--err)}
.dot.busy{animation:blink .8s ease-in-out infinite}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1.5rem}
.seg{position:relative;display:flex;gap:1.4rem;height:36px}
.seg::after{content:"";position:absolute;left:var(--x,0);width:var(--w,0);bottom:0;height:2px;border-radius:2px;background:var(--ink);transition:left .3s cubic-bezier(.3,.8,.2,1),width .3s cubic-bezier(.3,.8,.2,1)}
.seg button{color:var(--mute);font:500 .9rem/1 var(--ui);transition:color .15s}
.seg button:hover,.seg button[aria-pressed=true]{color:var(--ink)}
.acts{display:flex;align-items:center;gap:.25rem;margin-left:.75rem}
.btn{height:36px;padding:0 .8rem;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;gap:.5rem;color:var(--mute);font:500 .875rem/1 var(--ui);white-space:nowrap;transition:color .15s,background-color .15s,opacity .15s}
.btn:hover{color:var(--ink);background:var(--hover)}
.btn.icon{width:36px;padding:0}
.btn.primary{background:var(--ink);color:var(--bg);margin-left:.5rem}
.btn.primary:hover{opacity:.85;background:var(--ink);color:var(--bg)}
.btn.spin svg{animation:spin .8s linear infinite}
.tog{height:36px;padding:0;color:var(--mute);font:500 .9rem/1 var(--ui);box-shadow:inset 0 -2px 0 transparent;transition:color .15s,box-shadow .2s}
.tog:hover{color:var(--ink)}
.tog[aria-pressed=true],.tog[aria-checked=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}
.lede{font:300 clamp(1.6rem,3.3vw,2.7rem)/1.3 var(--ui);letter-spacing:-.025em;color:var(--mute);max-width:22em;text-wrap:balance}
.lede b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.fields{display:grid;gap:1.1rem}
.field{position:relative}
.field>svg{position:absolute;left:0;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none;transition:color .15s}
.field:focus-within>svg{color:var(--ink)}
.in,.dd-btn{width:100%;height:44px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;color:var(--ink);font:400 1rem/1 var(--ui);transition:border-color .15s}
.in{padding:0 4.4rem 0 1.9rem}
.in::placeholder{color:var(--faint)}
.in::-webkit-search-cancel-button{display:none}
.in:hover,.dd-btn:hover{border-bottom-color:var(--faint)}
.in:focus{outline:none;border-bottom-color:var(--ink)}
.exact{position:absolute;right:0;top:50%;translate:0 -50%;height:28px;padding:0 .65rem;border-radius:var(--r);font:500 .8rem/1 var(--ui);color:var(--faint);transition:all .15s}
.exact:hover{color:var(--ink)}
.exact[aria-pressed=true]{background:var(--hover);color:var(--ink)}
#ddHost{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 1.75rem}
.dd{position:relative}
.dd-box{position:relative}
.dd-btn{display:flex;align-items:center;padding:0 1.7rem 0 0;text-align:left;color:var(--mute);font-size:.95rem}
.dd-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd.set .dd-btn{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.dd-c{position:absolute;right:.1rem;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none;transition:rotate .2s}
.dd-btn[aria-expanded=true]~.dd-c{rotate:180deg}
.dd.set .dd-c{display:none}
.dd-x{position:absolute;right:0;top:50%;translate:0 -50%;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.dd-x:hover{background:var(--hover)}
.dd-panel{position:absolute;z-index:30;left:0;min-width:max(100%,240px);max-width:340px;top:calc(100% + 6px);background:var(--surf);border:1px solid var(--line2);border-radius:var(--rl);box-shadow:var(--pop);padding:.4rem;animation:pop .14s ease}
.dd.up .dd-panel{top:auto;bottom:calc(100% + 6px)}
.dd.end .dd-panel{left:auto;right:0}
.dd-q{width:100%;height:36px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:0 .65rem;margin-bottom:.3rem;font-size:.9rem}
.dd-q:focus{outline:none;border-bottom-color:var(--ink)}
.dd-t{display:none}
.dd-list{list-style:none;max-height:264px;overflow:auto;padding:0;outline:none}
.dd-o{display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border-radius:var(--r);cursor:pointer;font-size:.9rem;color:var(--mute)}
.dd-o.act{background:var(--hover);color:var(--ink)}
.dd-o.sel{color:var(--ink);font-weight:600}
.dd-o.sel::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1.4rem}
.lbl{color:var(--faint);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;min-height:24px;color:var(--mute);font-size:.85rem}
.link{color:var(--mute);font-size:.85rem;text-decoration:underline;text-underline-offset:4px;transition:color .15s}
.link:hover{color:var(--ink)}
.link.end{margin-left:auto}
.banner{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;border:1px solid var(--line);border-left:2px solid var(--st);border-radius:var(--r);background:var(--surf);font-size:.9rem}
.banner .btn{margin-left:auto}
.box{position:relative;overflow:auto;height:min(72vh,800px);height:min(72dvh,800px);min-height:340px;border-top:1px solid var(--line2)}
.tin{position:relative}
.head,.r{display:grid;gap:1rem;padding:0 .5rem;align-items:center}
.head{position:sticky;top:0;z-index:2;height:46px;background:var(--bg);border-bottom:1px solid var(--line)}
.head button{display:flex;align-items:center;gap:.3rem;height:100%;color:var(--mute);font:500 .78rem/1 var(--ui);transition:color .15s}
.head button:hover,.head button[aria-sort]{color:var(--ink)}
.head svg{opacity:0;transition:opacity .15s,rotate .2s}
.head button[aria-sort] svg{opacity:1}
.head button[aria-sort=descending] svg{rotate:180deg}
#body{position:relative}
.r{position:absolute;left:0;right:0;height:var(--row,52px);border-bottom:1px solid var(--line);font-size:.92rem;transition:background .12s}
@media(hover:hover){.r:hover{background:var(--hover)}}
.r>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name{font-weight:500}
.src::before{content:"";display:inline-block;vertical-align:middle;width:12px;height:6px;border-radius:6px;margin-right:.55rem;background:var(--faint)}
.src[data-s=Workforce]::before{background:var(--wf)}
.src[data-s=Student]::before{background:var(--st)}
.u{display:flex;align-items:center;gap:.9rem}
.u span{min-width:5ch;font-weight:500;font-variant-numeric:tabular-nums}
.u i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.u b{display:block;height:100%;border-radius:3px;background:var(--mute);opacity:.55;min-width:3px;transition:width .3s}
.u b[data-s=Workforce]{background:var(--wf);opacity:1}
.u b[data-s=Student]{background:var(--st);opacity:1}
.empty{position:absolute;inset:46px 0 0;display:grid;place-content:center;justify-items:center;gap:.8rem;color:var(--mute);text-align:center;pointer-events:none}
.empty button{pointer-events:auto}
dialog{margin:auto;border:1px solid var(--line2);border-radius:var(--rl);background:var(--surf);color:var(--ink);padding:0;width:min(720px,92vw);box-shadow:var(--pop)}
dialog::backdrop{background:rgba(16,20,21,.4);backdrop-filter:blur(3px)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line)}
.dh h2{font:600 1.05rem/1 var(--ui);margin-right:auto}
.db{max-height:60vh;overflow:auto;padding:.2rem 1.4rem 1.1rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--mute);font-weight:500;font-size:.78rem;padding:.9rem .5rem}
td{padding:.6rem .5rem;border-top:1px solid var(--line)}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
@keyframes spin{to{rotate:360deg}}
@keyframes blink{50%{opacity:.3}}
@keyframes pop{from{opacity:0;translate:0 -4px}}
@media(max-width:900px){#ddHost{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(pointer:coarse){.btn,.tog,.seg{height:40px}.btn.icon{width:40px}.dd-x{width:32px;height:32px}}
@media(max-width:960px){
.tin{min-width:0!important}
.head{display:flex;gap:1.2rem;overflow-x:auto;scrollbar-width:none;padding:0 .25rem}
.head::before{content:"Sort";color:var(--faint);font-size:.78rem;align-self:center;flex:none}
.head button{flex:none;white-space:nowrap}
.r{display:flex;flex-wrap:wrap;align-content:center;align-items:baseline;gap:0;padding:.3rem .25rem;overflow:hidden}
.r>div{order:3;flex:none;max-width:100%;padding-right:.9rem;font-size:.82rem;line-height:1.4;color:var(--mute)}
.r>.t{order:1;flex:1 1 calc(100% - 7rem);min-width:0;padding-right:.75rem;font-size:1rem;line-height:1.35;font-weight:600;color:var(--ink)}
.r>.u{order:2;flex:0 0 6.5rem;justify-content:flex-end;padding:0;font-size:.95rem;color:var(--ink)}
.u i{display:none}
.u span{min-width:0;text-align:right}
}
@media(max-width:640px){
.top{gap:.9rem}
.brand{width:100%}
.stat{margin-left:auto;padding:0;border:0}
.tools{width:100%;gap:.4rem}
.seg{width:100%;gap:0}
.seg button{flex:1;text-align:center}
.acts{width:100%;margin-left:0}
.btn.primary{margin-left:auto}
.lede{font-size:1.55rem}
#ddHost{grid-template-columns:repeat(2,minmax(0,1fr));gap:.25rem 1.25rem}
.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pad)*-1);padding-inline:var(--pad)}
.row::-webkit-scrollbar,.head::-webkit-scrollbar{display:none}
.row>*{flex:none}
.box{height:min(78vh,820px);height:min(78dvh,820px)}
.dd .dd-panel{position:fixed;left:0!important;right:0!important;top:auto!important;bottom:0!important;min-width:0;max-width:none;border-radius:22px 22px 0 0;border-bottom:0;padding:.4rem .9rem calc(.9rem + env(safe-area-inset-bottom));box-shadow:0 0 0 100vmax rgba(16,20,21,.42);animation:sheet .22s ease}
.dd-t{display:block;padding:.9rem .35rem .6rem;font:600 .95rem/1 var(--ui)}
.dd-list{max-height:min(50vh,420px);max-height:min(50dvh,420px)}
.dd-o{padding:.8rem .75rem;font-size:1rem}
.dd-q{height:44px;font-size:1rem}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;border-bottom:0;max-height:88vh;max-height:88dvh}
table{min-width:560px}
.db{padding-bottom:calc(1.1rem + env(safe-area-inset-bottom))}
}
@keyframes sheet{from{translate:0 28px;opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <svg class="mark" id="mark" viewBox="0 0 44 44" aria-hidden="true">
        <g transform="rotate(-40 22 22)">
          <path d="M22 11h-8a11 11 0 0 0 0 22h8z" fill="var(--wf)"/>
          <path d="M22 11h8a11 11 0 0 1 0 22h-8z" fill="var(--st)"/>
        </g>
      </svg>
      <h1>LX Database</h1>
      <p class="stat"><span class="dot" id="dot"></span><span id="stat">Connecting</span></p>
    </div>
    <div class="tools">
      <div class="seg" id="seg" role="group" aria-label="Source">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="Workforce" aria-pressed="false">Workforce</button>
        <button data-v="Student" aria-pressed="false">Student</button>
      </div>
      <div class="acts">
        <button class="tog" id="autoBtn" role="switch" aria-checked="false" title="Sync every 45 seconds">Auto-sync</button>
        <button class="btn icon" id="syncBtn" title="Sync now" aria-label="Sync now"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></button>
        <button class="btn icon" id="themeBtn" title="Switch theme" aria-label="Switch theme">
          <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
        <button class="btn primary" id="exportBtn">Export CSV</button>
      </div>
    </div>
  </header>

  <p class="lede" aria-live="polite"><b id="nU">0</b> units sold across <b id="nM">0</b> medications at <b id="nP">0</b> pharmacies.</p>

  <section class="fields">
    <div class="field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="in" id="search" type="search" placeholder="Search everything" autocomplete="off" aria-label="Search" title="Press / to search">
      <button class="exact" id="exactBtn" aria-pressed="false" title="Match the exact phrase">Exact</button>
    </div>
    <div id="ddHost"></div>
    <div class="row" id="groups">
      <span class="lbl">Group by</span>
      <button class="tog" data-k="_source" aria-pressed="false">Source</button>
      <button class="tog" data-k="name" aria-pressed="false">Medication</button>
      <button class="tog" data-k="pharmacy" aria-pressed="false">Pharmacy</button>
      <button class="tog" data-k="region" aria-pressed="false">Region</button>
      <button class="tog" data-k="month" aria-pressed="false">Month</button>
      <button class="tog" data-k="unit" aria-pressed="false">Unit type</button>
      <button class="tog" data-k="method" aria-pressed="false">Method</button>
    </div>
  </section>

  <div class="banner" id="banner" hidden></div>

  <div>
    <div class="meta">
      <span id="count" aria-live="polite">Loading…</span>
      <button class="link" id="reset" hidden>Reset all</button>
      <button class="link end" id="dupBtn" hidden></button>
    </div>
    <div class="box" id="box">
      <div class="tin" id="tin">
        <div class="head" id="head"></div>
        <div id="body"></div>
      </div>
      <div class="empty" id="empty"></div>
    </div>
  </div>
</div>

<dialog id="dup">
  <div class="dh">
    <h2>Merged duplicates</h2>
    <button class="btn" id="remerge" hidden>Merge all again</button>
    <button class="btn icon" id="dupClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="db">
    <table>
      <thead><tr><th>Medication</th><th>Pharmacy</th><th>Region</th><th>Rows</th><th>Units</th><th></th></tr></thead>
      <tbody id="dupBody"></tbody>
    </table>
  </div>
</dialog>

<script>
const FMT = new Intl.NumberFormat();
const MQ = matchMedia('(max-width: 960px)');
const PHONE = matchMedia('(max-width: 640px)');
let ROW = 52;
const applyRow = () => {
  ROW = MQ.matches ? 84 : 52;
  document.documentElement.style.setProperty('--row', ROW + 'px');
};
applyRow();
const EVERY = 45000;
const FEEDS = [
  ['Workforce', 'https://firecloud.rubberylock7.workers.dev/read/plan-b'],
  ['Student', 'https://firecloud.rubberylock7.workers.dev/read/plan-c']
];
const KEYS = ['pharmacy', 'region', 'month', 'method', 'unit'];
const LABEL = { pharmacy: 'Pharmacy', region: 'Region', month: 'Month', method: 'Method', unit: 'Unit type' };
const PLACE = { pharmacy: 'All pharmacies', region: 'All regions', month: 'All months', method: 'All methods', unit: 'All unit types' };
const COLS = [
  { k: '_source', l: 'Source', w: 'minmax(120px,.8fr)', cls: 'src' },
  { k: 'name', l: 'Medication', w: 'minmax(180px,2fr)', cls: 'c-name' },
  { k: 'pharmacy', l: 'Pharmacy', w: 'minmax(140px,1.4fr)' },
  { k: 'region', l: 'Region', w: 'minmax(100px,.9fr)' },
  { k: 'month', l: 'Month', w: 'minmax(90px,.8fr)' },
  { k: 'unit', l: 'Unit type', w: 'minmax(90px,.8fr)' },
  { k: 'method', l: 'Method', w: 'minmax(90px,.8fr)' },
  { k: 'unitSold', l: 'Units sold', w: 'minmax(190px,1.3fr)', num: true }
];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CHEVRON = '<svg class="dd-c" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const CROSS = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

const $ = id => document.getElementById(id);
const store = (k, v) => {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
  return null;
};
const clean = v => String(v ?? '').trim();
const blankFilters = () => ({ pharmacy: '', region: '', month: '', method: '', unit: '' });
const natural = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), undefined, { numeric: true, sensitivity: 'base' });

const S = {
  bySrc: {}, all: [], view: [], shown: [], groups: [], dd: {},
  unmerged: new Set(), failed: {},
  src: 'all', q: '', exact: false, f: blankFilters(), by: [],
  sort: { key: null, dir: 1 },
  syncing: false, auto: false, timer: null, last: null, loaded: false,
  colsKey: '', cols: COLS, nodes: [], max: 0, frame: 0
};

function makeDropdown(k, onPick) {
  const host = document.createElement('div');
  host.className = 'dd';
  host.innerHTML = `<div class="dd-box"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${LABEL[k]}"><span class="dd-v"></span></button>${CHEVRON}<button type="button" class="dd-x" aria-label="Clear ${LABEL[k]}" hidden>${CROSS}</button><div class="dd-panel" hidden><p class="dd-t">${LABEL[k]}</p><input class="dd-q" type="search" placeholder="Filter" aria-label="Filter ${LABEL[k]}" hidden><ul class="dd-list" role="listbox" tabindex="-1"></ul></div></div>`;
  const btn = host.querySelector('.dd-btn'), val = host.querySelector('.dd-v'), clear = host.querySelector('.dd-x');
  const panel = host.querySelector('.dd-panel'), q = host.querySelector('.dd-q'), list = host.querySelector('.dd-list');
  const d = { host, opts: [], val: '', idx: 0, view: [] };

  const setIdx = (i, scroll = true) => {
    const items = list.children;
    if (!items.length) return;
    i = Math.max(0, Math.min(items.length - 1, i));
    items[d.idx]?.classList.remove('act');
    d.idx = i;
    items[i].classList.add('act');
    if (scroll) items[i].scrollIntoView({ block: 'nearest' });
  };

  const render = () => {
    const term = q.value.trim().toLowerCase();
    d.view = [{ v: '', t: PLACE[k] }, ...d.opts.filter(o => !term || o.toLowerCase().includes(term)).map(o => ({ v: o, t: o }))];
    list.replaceChildren(...d.view.map((o, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(o.v === d.val));
      li.className = 'dd-o' + (o.v === d.val ? ' sel' : '');
      li.textContent = o.t;
      li.addEventListener('mousedown', e => e.preventDefault());
      li.addEventListener('click', () => pick(o.v));
      li.addEventListener('mousemove', () => { if (d.idx !== i) setIdx(i, false); });
      return li;
    }));
    d.idx = 0;
  };

  const close = refocus => {
    if (panel.hidden) return;
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    if (refocus) btn.focus();
  };

  const open = () => {
    Object.values(S.dd).forEach(o => o !== d && o.close(false));
    host.classList.remove('up', 'end');
    q.hidden = d.opts.length <= 8;
    q.value = '';
    render();
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    const r = panel.getBoundingClientRect();
    if (r.bottom > innerHeight && btn.getBoundingClientRect().top > r.height + 16) host.classList.add('up');
    if (r.right > innerWidth - 8) host.classList.add('end');
    setIdx(Math.max(0, d.view.findIndex(o => o.v === d.val)));
    (q.hidden || PHONE.matches ? list : q).focus({ preventScroll: true });
  };

  const pick = v => { close(true); onPick(k, v); };

  btn.addEventListener('click', () => panel.hidden ? open() : close(true));
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (panel.hidden) open(); }
  });
  clear.addEventListener('click', () => onPick(k, ''));
  q.addEventListener('input', () => { render(); setIdx(q.value.trim() && d.view.length > 1 ? 1 : 0); });
  panel.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setIdx(d.idx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setIdx(d.idx - 1); }
    else if (e.key === 'Home') { e.preventDefault(); setIdx(0); }
    else if (e.key === 'End') { e.preventDefault(); setIdx(d.view.length - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (d.view[d.idx]) pick(d.view[d.idx].v); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); }
    else if (e.key === 'Tab') close(false);
  });
  document.addEventListener('pointerdown', e => { if (!host.contains(e.target)) close(false); });

  d.close = close;
  d.update = (opts, v) => {
    d.opts = opts;
    d.val = v;
    val.textContent = v || PLACE[k];
    host.classList.toggle('set', !!v);
    clear.hidden = !v;
    if (!panel.hidden) render();
  };
  return d;
}

async function fetchFeed(src, url) {
  let res;
  try { res = await fetch(url, { cache: 'no-store' }); }
  catch (e) { throw new Error(`${src} feed is unreachable`); }
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error || ''; } catch (e) {}
    throw new Error(`${src} feed failed (${res.status}${detail ? ': ' + detail : ''})`);
  }
  const raw = await res.json();
  if (!raw) return [];
  return Object.values(raw).flat()
    .filter(x => x && typeof x === 'object')
    .map(x => ({
      _source: src,
      name: clean(x.name), pharmacy: clean(x.pharmacy), region: clean(x.region),
      month: clean(x.month), unit: clean(x.unit), method: clean(x.method),
      unitSold: Number(x.unitSold) || 0
    }));
}

async function load() {
  if (S.syncing) return;
  S.syncing = true;
  paintStatus();
  const results = await Promise.allSettled(FEEDS.map(([s, u]) => fetchFeed(s, u)));
  S.failed = {};
  results.forEach((r, i) => {
    const s = FEEDS[i][0];
    if (r.status === 'fulfilled') S.bySrc[s] = r.value;
    else S.failed[s] = r.reason.message;
  });
  if (Object.keys(S.failed).length < FEEDS.length) S.last = new Date();
  S.syncing = false;
  S.loaded = true;
  rebuild();
  paintStatus();
  paintBanner();
}

function rebuild() {
  const groups = new Map();
  for (const [src] of FEEDS) {
    for (const it of S.bySrc[src] || []) {
      const h = [it._source, it.name, it.pharmacy, it.region, it.month, it.unit, it.method].join('\u0001');
      if (!groups.has(h)) groups.set(h, []);
      groups.get(h).push(it);
    }
  }
  const stamp = o => {
    o._s = `${o._source} ${o.name} ${o.pharmacy} ${o.region} ${o.month} ${o.method} ${o.unit}`.toLowerCase();
    return o;
  };
  S.all = [];
  S.groups = [];
  for (const [h, items] of groups) {
    if (items.length > 1 && !S.unmerged.has(h)) {
      const total = items.reduce((a, i) => a + i.unitSold, 0);
      S.all.push(stamp({ ...items[0], unitSold: total }));
      S.groups.push({ h, name: items[0].name, pharmacy: items[0].pharmacy, region: items[0].region, count: items.length, total });
    } else {
      items.forEach(i => S.all.push(stamp({ ...i })));
    }
  }
  paintDupNotice();
  derive();
}

function derive() {
  const q = S.q.trim().toLowerCase();
  const toks = q && !S.exact ? q.split(/\s+/) : [];
  const opts = {};
  KEYS.forEach(k => opts[k] = new Set());
  const out = [];

  for (const r of S.all) {
    let m = 0;
    if (S.src !== 'all' && r._source !== S.src) m |= 1;
    if (q && (S.exact ? !r._s.includes(q) : toks.some(t => !r._s.includes(t)))) m |= 2;
    KEYS.forEach((k, i) => { if (S.f[k] && r[k] !== S.f[k]) m |= 4 << i; });
    if (!m) out.push(r);
    KEYS.forEach((k, i) => { if (!(m & ~(4 << i))) opts[k].add(r[k]); });
  }

  let stale = false;
  KEYS.forEach(k => { if (S.f[k] && !opts[k].has(S.f[k])) { S.f[k] = ''; stale = true; } });
  if (stale) return derive();

  KEYS.forEach(k => S.dd[k].update([...opts[k]].filter(Boolean).sort(natural), S.f[k]));
  S.view = out;

  if (S.by.length) {
    const map = new Map();
    for (const r of out) {
      const key = S.by.map(g => r[g]).join('\u0001');
      let o = map.get(key);
      if (!o) { o = { unitSold: 0 }; S.by.forEach(g => o[g] = r[g]); map.set(key, o); }
      o.unitSold += r.unitSold;
    }
    S.shown = [...map.values()];
  } else {
    S.shown = out.slice();
  }

  const cols = S.by.length ? COLS.filter(c => S.by.includes(c.k) || c.num) : COLS;
  const key = cols.map(c => c.k).join('-');
  if (!cols.some(c => c.k === S.sort.key)) S.sort.key = null;
  sortShown();
  if (key !== S.colsKey) { S.colsKey = key; S.cols = cols; buildTable(); }
  paintHead();
  show();
}

function sortShown() {
  const { key, dir } = S.sort;
  if (!key) return;
  const col = COLS.find(c => c.k === key);
  S.shown.sort(col.num ? (a, b) => (a[key] - b[key]) * dir : (a, b) => natural(a[key], b[key]) * dir);
}

function buildTable() {
  const tpl = S.cols.map(c => c.w).join(' ');
  $('tin').style.minWidth = `${S.cols.length * 120 + 48}px`;
  const head = $('head');
  head.style.gridTemplateColumns = tpl;
  head.replaceChildren(...S.cols.map(c => {
    const b = document.createElement('button');
    b.dataset.k = c.k;
    b.append(c.l);
    b.insertAdjacentHTML('beforeend', '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
    b.addEventListener('click', () => {
      if (S.sort.key === c.k) S.sort.dir *= -1;
      else { S.sort.key = c.k; S.sort.dir = c.num ? -1 : 1; }
      sortShown();
      paintHead();
      paint(true);
    });
    return b;
  }));
  S.nodes = [];
  $('body').replaceChildren();
  ensurePool();
}

function makeNode() {
  const el = document.createElement('div');
  el.className = 'r';
  el.style.gridTemplateColumns = S.cols.map(c => c.w).join(' ');
  el.hidden = true;
  const titleKey = S.cols.some(c => c.k === 'name') ? 'name' : S.cols[0].k;
  const setters = S.cols.map(c => {
    const cell = document.createElement('div');
    el.appendChild(cell);
    if (c.num) {
      cell.className = 'u';
      cell.innerHTML = '<span></span><i><b></b></i>';
      const sp = cell.firstChild, bar = cell.querySelector('b');
      return r => {
        sp.textContent = FMT.format(r.unitSold);
        bar.style.width = (S.max > 0 ? Math.max(0, r.unitSold) / S.max * 100 : 0) + '%';
        bar.dataset.s = r._source || '';
      };
    }
    if (c.cls) cell.className = c.cls;
    if (c.k === titleKey) cell.classList.add('t');
    if (c.k === '_source') return r => { cell.dataset.s = r._source; cell.textContent = r._source; };
    return r => { cell.textContent = r[c.k] || '—'; };
  });
  $('body').appendChild(el);
  return { el, setters, i: -1, f: 0 };
}

function ensurePool() {
  const need = Math.ceil($('box').clientHeight / ROW) + 4;
  while (S.nodes.length < need) S.nodes.push(makeNode());
}

function paint(force) {
  const n = S.shown.length;
  const L = S.nodes.length;
  if (!L) return;
  const start = Math.max(0, Math.floor($('box').scrollTop / ROW) - 1);
  const end = Math.min(n - 1, start + L - 1);
  const frame = ++S.frame;
  for (let i = start; i <= end; i++) {
    const node = S.nodes[i % L];
    node.f = frame;
    if (force || node.i !== i) {
      node.i = i;
      const r = S.shown[i];
      node.el.style.transform = `translateY(${i * ROW}px)`;
      node.el.hidden = false;
      node.setters.forEach(set => set(r));
    }
  }
  for (const node of S.nodes) {
    if (node.f !== frame) { node.i = -1; node.el.hidden = true; }
  }
}

function show() {
  let units = 0;
  const meds = new Set(), pharms = new Set();
  for (const r of S.view) { units += r.unitSold; meds.add(r.name); pharms.add(r.pharmacy); }
  S.max = S.shown.reduce((a, r) => Math.max(a, r.unitSold), 0);
  tween($('nU'), units);
  tween($('nM'), meds.size);
  tween($('nP'), pharms.size);

  $('body').style.height = `${S.shown.length * ROW}px`;
  paint(true);

  const n = S.shown.length;
  const grouped = S.by.length > 0;
  $('count').textContent = !S.loaded ? 'Loading…'
    : `${FMT.format(n)} ${grouped ? (n === 1 ? 'group' : 'groups') : (n === 1 ? 'record' : 'records')}` +
      (!grouped && n !== S.all.length ? ` of ${FMT.format(S.all.length)}` : '');

  $('reset').hidden = !(S.q || S.src !== 'all' || S.by.length || KEYS.some(k => S.f[k]));
  paintEmpty();
}

function paintEmpty() {
  const el = $('empty');
  el.replaceChildren();
  if (S.shown.length) { el.hidden = true; return; }
  el.hidden = false;
  const msg = document.createElement('p');
  if (!S.loaded) { msg.textContent = 'Loading data…'; el.append(msg); return; }
  if (!S.all.length) { msg.textContent = 'No records yet. Check the connection, then sync again.'; el.append(msg); return; }
  msg.textContent = 'Nothing matches these filters.';
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = 'Reset all';
  b.addEventListener('click', resetAll);
  el.append(msg, b);
}

function paintHead() {
  $('head').querySelectorAll('button').forEach(b => {
    if (b.dataset.k === S.sort.key) b.setAttribute('aria-sort', S.sort.dir === 1 ? 'ascending' : 'descending');
    else b.removeAttribute('aria-sort');
  });
}

function tween(el, to) {
  const from = Number(el.dataset.v) || 0;
  el.dataset.v = to;
  cancelAnimationFrame(el._raf);
  if (reduced || from === to) { el.textContent = FMT.format(to); return; }
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min((now - t0) / 450, 1);
    el.textContent = FMT.format(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
    if (p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

function paintStatus() {
  const failedAll = Object.keys(S.failed).length === FEEDS.length;
  $('dot').className = 'dot' + (S.syncing ? ' busy' : failedAll ? ' err' : S.last ? ' ok' : '');
  $('mark').classList.toggle('busy', S.syncing);
  $('syncBtn').classList.toggle('spin', S.syncing);
  let text = 'Connecting';
  if (S.syncing) text = 'Syncing';
  else if (failedAll) text = 'Offline';
  else if (S.last) text = 'Updated ' + S.last.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('stat').textContent = text;
}

function paintBanner() {
  const el = $('banner');
  const msgs = Object.values(S.failed);
  if (!msgs.length) { el.hidden = true; return; }
  const span = document.createElement('span');
  span.textContent = msgs.join('. ') + '.' + (S.all.length ? ' Showing the last data received.' : '');
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = 'Try again';
  b.addEventListener('click', load);
  el.replaceChildren(span, b);
  el.hidden = false;
}

function paintDupNotice() {
  const btn = $('dupBtn');
  const merged = S.groups.reduce((a, g) => a + g.count - 1, 0);
  btn.hidden = !(S.groups.length || S.unmerged.size);
  btn.textContent = merged ? `${merged} duplicate${merged > 1 ? 's' : ''} merged` : 'Duplicates unmerged';
  if ($('dup').open) paintDup();
}

function paintDup() {
  $('dupBody').replaceChildren(...S.groups.map(g => {
    const tr = document.createElement('tr');
    [g.name, g.pharmacy, g.region, g.count, FMT.format(g.total)].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = 'Unmerge';
    b.addEventListener('click', () => { S.unmerged.add(g.h); rebuild(); });
    td.appendChild(b);
    tr.appendChild(td);
    return tr;
  }));
  $('remerge').hidden = !S.unmerged.size;
  if (!S.groups.length && !S.unmerged.size) $('dup').close();
}

function placeSeg() {
  const b = $('seg').querySelector('[aria-pressed=true]');
  if (!b) return;
  $('seg').style.setProperty('--x', b.offsetLeft + 'px');
  $('seg').style.setProperty('--w', b.offsetWidth + 'px');
}

function setSource(v) {
  S.src = v;
  $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  placeSeg();
}

function setAuto(on) {
  S.auto = on;
  store('lx-auto', on ? '1' : '0');
  clearInterval(S.timer);
  S.timer = on ? setInterval(() => { if (!document.hidden) load(); }, EVERY) : null;
  $('autoBtn').setAttribute('aria-checked', String(on));
}

function resetAll() {
  S.q = '';
  S.exact = false;
  S.f = blankFilters();
  S.by = [];
  S.sort = { key: null, dir: 1 };
  $('search').value = '';
  $('exactBtn').setAttribute('aria-pressed', 'false');
  $('groups').querySelectorAll('.tog').forEach(c => c.setAttribute('aria-pressed', 'false'));
  setSource('all');
  derive();
}

function exportCSV() {
  const esc = v => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [S.cols.map(c => esc(c.l)).join(',')];
  for (const r of S.shown) lines.push(S.cols.map(c => c.num ? String(r[c.k] ?? 0) : esc(r[c.k])).join(','));
  const url = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `LX_Export_${new Date().toISOString().slice(0, 10)}.csv` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function bind() {
  KEYS.forEach(k => {
    S.dd[k] = makeDropdown(k, (key, v) => { S.f[key] = v; derive(); });
    $('ddHost').appendChild(S.dd[k].host);
  });

  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    setSource(b.dataset.v);
    derive();
  });
  new ResizeObserver(placeSeg).observe($('seg'));
  MQ.addEventListener('change', () => { applyRow(); S.colsKey = ''; derive(); });
  $('syncBtn').addEventListener('click', load);
  $('autoBtn').addEventListener('click', () => setAuto(!S.auto));
  $('exportBtn').addEventListener('click', exportCSV);
  $('themeBtn').addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    store('lx-theme', t);
  });

  $('search').addEventListener('input', debounce(e => { S.q = e.target.value; derive(); }, 120));
  $('exactBtn').addEventListener('click', () => {
    S.exact = !S.exact;
    $('exactBtn').setAttribute('aria-pressed', String(S.exact));
    if (S.q.trim()) derive();
  });

  $('groups').addEventListener('click', e => {
    const c = e.target.closest('.tog');
    if (!c) return;
    const i = S.by.indexOf(c.dataset.k);
    if (i > -1) S.by.splice(i, 1); else S.by.push(c.dataset.k);
    c.setAttribute('aria-pressed', String(i === -1));
    derive();
  });
  $('reset').addEventListener('click', resetAll);

  $('dupBtn').addEventListener('click', () => { paintDup(); $('dup').showModal(); });
  $('dupClose').addEventListener('click', () => $('dup').close());
  $('remerge').addEventListener('click', () => { S.unmerged.clear(); rebuild(); });
  $('dup').addEventListener('click', e => { if (e.target === $('dup')) $('dup').close(); });

  let raf = 0;
  $('box').addEventListener('scroll', () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(false); });
  }, { passive: true });
  new ResizeObserver(() => { ensurePool(); paint(true); }).observe($('box'));

  document.addEventListener('keydown', e => {
    const tag = (document.activeElement || {}).tagName;
    if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(tag) && !$('dup').open) {
      e.preventDefault();
      $('search').focus();
    } else if (e.key === 'Escape' && document.activeElement === $('search') && $('search').value) {
      $('search').value = '';
      S.q = '';
      derive();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.auto && S.last && Date.now() - S.last > EVERY) load();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  bind();
  setAuto(store('lx-auto') === '1');
  derive();
  load();
});
</script>
</body>
